<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rave Radar Brasil</title>
</head>
<body>
    <h1>Rave Radar Brasil</h1>
    <div id="calendar">Carregando eventos...</div>

    <script>
        fetch('data/eventos.json')
            .then(response => {
                if (!response.ok) throw new Error("Erro ao carregar JSON");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('calendar');
                container.innerHTML = ''; // Limpa o "Carregando..."
                
                if (data.length === 0) {
                    container.innerHTML = '<p>Nenhum evento encontrado no momento.</p>';
                    return;
                }
                
                data.forEach(evento => {
                    container.innerHTML += `
                        <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                            <h3>${evento.title}</h3>
                            <p>Data: ${evento.start}</p>
                            <a href="${evento.url}" target="_blank">Ver evento no Sympla</a>
                        </div>`;
                });
            })
            .catch(error => {
                document.getElementById('calendar').innerHTML = '<p style="color: red;">Erro ao exibir eventos: ' + error.message + '</p>';
                console.error(error);
            });
    </script>
</body>
</html>
